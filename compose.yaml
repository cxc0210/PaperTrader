# 本地开发基础设施
# 启动：docker compose up -d
services:
  postgres:
    image: postgres:17
    container_name: local-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: paper_trader
    ports:
      - "5432:5432"
    volumes:
      - /Users/andrechen/Desktop/Andre/playground/postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: local-redis
    command: redis-server --appendonly yes --requirepass password
    ports:
      - "6379:6379"
    volumes:
      - /Users/andrechen/Desktop/Andre/playground/redis-data:/data
